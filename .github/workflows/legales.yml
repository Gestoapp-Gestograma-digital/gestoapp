# Publica los textos de legal/ en GitHub Pages cada vez que cambian en main.
name: Textos legales

on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'scripts/generar-legales.mjs'
      - '.github/workflows/legales.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/generar-legales.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
